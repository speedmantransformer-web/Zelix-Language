[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "zelix-lang"
dynamic = ["version"]
description = "A keyword-driven programming language with an interpreter and native compiler"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Zelix contributors" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Compilers",
]
dependencies = ["tomli>=2; python_version < '3.11'"]

[project.scripts]
zelix = "zelix:main"

[tool.setuptools]
py-modules = ["zelix", "compiler", "game_backend", "project", "debug_server", "syntax", "typesys"]
include-package-data = true

[tool.setuptools.dynamic]
version = { attr = "zelix.VERSION" }
