name: CI

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.12", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
      - run: python -m pip install .
      - run: python -m unittest discover -s tests -v
      - run: python zelix.py --version
      - run: python zelix.py --check examples/hello.zelix
      - run: python zelix.py --check examples/basics.zelix
      - run: python zelix.py --check examples/functions.zelix
      - run: python zelix.py --check examples/loops.zelix
      - run: python zelix.py --check examples/input.zelix
      - run: python zelix.py --check examples/game_2d.zelix
      - run: python zelix.py --check examples/game_3d.zelix
      - run: python zelix.py --check examples/game_multiplayer.zelix
      - run: zelix --version
      - run: node --check extension.js
        working-directory: vscode-zelix
      - run: npx --yes @vscode/vsce package --no-dependencies
        working-directory: vscode-zelix
