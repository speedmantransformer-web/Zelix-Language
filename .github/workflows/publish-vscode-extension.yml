name: Publish VS Code Extension

on:
  push:
    tags:
      - "vscode-v*"
  workflow_dispatch:
    inputs:
      version:
        description: Extension version to publish
        required: true
        default: "0.3.0"
        type: string

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m unittest discover -s tests -v
      - name: Validate version and extension files
        working-directory: vscode-zelix
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          if [[ "${GITHUB_EVENT_NAME}" == "push" ]]; then
            RELEASE_VERSION="${GITHUB_REF_NAME#vscode-v}"
          else
            RELEASE_VERSION="${REQUESTED_VERSION}"
          fi
          test "${RELEASE_VERSION}" = "${VERSION}"
          node --check extension.js
          node --check debug_adapter.js
          node -e "JSON.parse(require('fs').readFileSync('package.json', 'utf8')); JSON.parse(require('fs').readFileSync('snippets/zelix.json', 'utf8'))"
          echo "RELEASE_VERSION=${VERSION}" >> "$GITHUB_ENV"
          if [[ "${VERSION%%.*}" == "0" ]]; then
            echo "RELEASE_PRERELEASE=true" >> "$GITHUB_ENV"
          else
            echo "RELEASE_PRERELEASE=false" >> "$GITHUB_ENV"
          fi
      - name: Package extension
        working-directory: vscode-zelix
        run: npx --yes @vscode/vsce package --no-dependencies --out "zelix-language-${RELEASE_VERSION}.vsix"
      - name: Publish with Marketplace trusted publishing
        working-directory: vscode-zelix
        run: npx --yes @vscode/vsce publish --oidc
      - uses: softprops/action-gh-release@v2
        with:
          name: Zelix Language Extension ${{ env.RELEASE_VERSION }}
          tag_name: ${{ github.ref_name }}
          prerelease: ${{ env.RELEASE_PRERELEASE }}
          generate_release_notes: true
          files: vscode-zelix/zelix-language-${{ env.RELEASE_VERSION }}.vsix
